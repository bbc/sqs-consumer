name: Publish release

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false &&
      startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout main and fetch release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/heads/main

      - name: Verify release target
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_EVENT_SHA: ${{ github.event_name == 'release' && github.sha || '' }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          release_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$release_sha" HEAD

          if [[ -n "$RELEASE_EVENT_SHA" && ( "$release_sha" != "$RELEASE_EVENT_SHA" || "$release_sha" != "$RELEASE_TARGET" ) ]]; then
            echo "Release tag does not match its reviewed merge commit" >&2
            exit 1
          fi

          release_state=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '"\(.isDraft):\(.isPrerelease)"')
          if [[ "$release_state" != "false:false" ]]; then
            echo "Release $RELEASE_TAG is not a stable GitHub release" >&2
            exit 1
          fi
          printf 'commit=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: package-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}

      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependency signatures
        run: pnpm audit signatures

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          metadata=$(pnpm --silent release:validate -- "$RELEASE_TAG")
          node -e 'const release = JSON.parse(process.argv[1]); for (const [key, value] of Object.entries(release)) console.log(`${key}=${value}`)' "$metadata" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: pnpm build

      - name: Check npm release status
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify npm package
        if: steps.npm.outputs.published != 'true'
        run: npm pack --dry-run

      - name: Verify JSR package
        run: pnpm exec jsr publish --dry-run

      - name: Publish npm package
        if: steps.npm.outputs.published != 'true'
        run: npm publish

      - name: Publish JSR package
        run: pnpm exec jsr publish
