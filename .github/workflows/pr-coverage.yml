name: PR Coverage
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read

jobs:
  coverage_report:
    name: Generate coverage report
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pnpm and Node.js ${{ matrix.node-version }}
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true

      - name: Run Coverage Check
        run: pnpm lcov

      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@6c1aa0cc9e1c02f9f58f01ac599f1064ccc83470 # v1.1.0

      - name: Report code coverage
        id: coverage
        uses: zgosalvez/github-actions-report-lcov@7e6043a0e3ae37bc6e45291401ddea852fc750e5 # v7.2.3
        with:
          coverage-files: coverage/lcov.info
          minimum-coverage: 90
          genhtml-ignore-errors: category,inconsistent
          artifact-name: code-coverage-report

      - name: Summarise coverage
        if: ${{ !cancelled() && steps.coverage.outputs.total-coverage != '' }}
        env:
          COVERAGE: ${{ steps.coverage.outputs.total-coverage }}
        run: |
          printf 'Line coverage: %s%%\n' "$COVERAGE" >> "$GITHUB_STEP_SUMMARY"
